name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform init
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate -no-color

  shellcheck:
    name: ShellCheck (scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./scripts"
          severity: warning

  powershell:
    name: PSScriptAnalyzer (userdata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze userdata.ps1 body and vm/*.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          # Strip the EC2 <powershell>/<persist> wrapper tags before analysis
          Get-Content userdata.ps1 |
            Where-Object { $_ -notmatch '^\s*</?(powershell|persist)' } |
            Set-Content userdata-body.ps1
          $targets = @('userdata-body.ps1') + (Get-ChildItem vm -Filter *.ps1 | ForEach-Object FullName)
          $findings = @()
          foreach ($t in $targets) { $findings += Invoke-ScriptAnalyzer -Path $t -Severity Error }
          if ($findings) { $findings | Format-Table -AutoSize; exit 1 }
          Write-Host "No errors in $($targets.Count) file(s)."

  security:
    name: tfsec (IaC security scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          github_token: ${{ github.token }}

  knowledge-base:
    name: Knowledge base (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No database and no driver installed on purpose: the ingestion module
      # must stay importable and its pure functions testable without either.
      - name: Run ingestion tests
        run: python vm/kb/test_ingest.py
      - name: Byte-compile pipeline
        run: python -m compileall -q vm/kb/ingest.py vm/kb/search.py

  rules-engine:
    name: TDS rules engine (self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Statutory arithmetic must never regress silently: every case in this
      # self-test comes from real filed work, not invented examples.
      - name: Run rules engine self-test
        run: python vm/rules/tds_engine.py
      - name: Validate rule set is parseable JSON
        run: python -c "import json;d=json.load(open('vm/rules/tds-in.json'));print(len(d['rules']),'rules loaded')"
      - name: Every rule must cite an authority
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('vm/rules/tds-in.json'))
          bad = [r['id'] for r in d['rules'] if not r.get('authority')]
          if bad:
              sys.exit(f"rules without an authority citation: {bad}")
          print(f"all {len(d['rules'])} rules cite an authority")
          PY
