name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Attach share package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build TallyCloud-new.zip
        run: |
          zip -rq TallyCloud-new.zip . \
            -x ".git/*" -x ".github/*" -x "docs/*"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" TallyCloud-new.zip --clobber
