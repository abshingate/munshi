<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#18263a">
<title>Munshi — AI Accountant</title>
<link rel="stylesheet" href="/tailwind.css">
<style>
  /* The few things Tailwind utilities don't cover cleanly */
  @keyframes typing { 0%,80%,100%{opacity:.25;transform:translateY(0)} 40%{opacity:1;transform:translateY(-3px)} }
  .typing-dot { animation: typing 1.2s infinite; }
  .typing-dot:nth-child(2){ animation-delay:.2s } .typing-dot:nth-child(3){ animation-delay:.4s }
  @keyframes toast-in { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  .toast { animation: toast-in .18s ease-out; }
  @keyframes sheet-in { from{transform:translateY(24px);opacity:.6} to{transform:translateY(0);opacity:1} }
  .sheet { animation: sheet-in .18s ease-out; }
  textarea { field-sizing: content; }
</style>
</head>
<body class="h-dvh flex flex-col bg-slate-100 text-slate-800 antialiased overscroll-none">

<!-- Toasts -->
<div id="toasts" aria-live="polite" class="fixed top-3 inset-x-0 z-50 flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

<!-- Header -->
<header class="shrink-0 bg-navy text-white pt-[env(safe-area-inset-top)] shadow-md z-20">
  <div class="max-w-2xl mx-auto flex items-center gap-3 px-4 py-2.5">
    <div class="w-9 h-9 rounded-full bg-gold text-navy font-extrabold grid place-items-center text-lg select-none">म</div>
    <div class="flex-1 min-w-0">
      <div class="font-semibold text-[15px] leading-tight">Munshi · AI Accountant</div>
      <div class="flex items-center gap-1.5 text-[11px] text-white/70">
        <span id="tallyDot" class="w-2 h-2 rounded-full bg-red-400"></span>
        <span id="statusText" class="truncate">connecting…</span>
      </div>
    </div>
    <button id="menuBtn" aria-label="Menu" class="w-9 h-9 rounded-lg bg-white/10 hover:bg-white/20 active:scale-95 transition grid place-items-center text-lg">⋯</button>
  </div>
</header>

<!-- Chat -->
<main id="chatScroll" class="flex-1 overflow-y-auto">
  <div id="chat" class="max-w-2xl mx-auto w-full px-3 py-4 flex flex-col gap-2.5"></div>
</main>

<!-- Attachment previews -->
<div id="preview" class="hidden shrink-0 bg-white/80 backdrop-blur border-t border-slate-200">
  <div class="max-w-2xl mx-auto flex gap-2 px-3 py-2 overflow-x-auto"></div>
</div>

<!-- Suggestion chips (empty state only) -->
<div id="chips" class="shrink-0">
  <div class="max-w-2xl mx-auto flex gap-2 px-3 pb-2 overflow-x-auto">
    <button data-q="What did I spend this month?" class="chip shrink-0 bg-white border border-slate-300 rounded-full px-3.5 py-1.5 text-xs text-slate-600 active:scale-95 transition">💸 Spending this month</button>
    <button data-q="Show me today's entries" class="chip shrink-0 bg-white border border-slate-300 rounded-full px-3.5 py-1.5 text-xs text-slate-600 active:scale-95 transition">📒 Today's entries</button>
    <button data-q="What are my cash and bank balances?" class="chip shrink-0 bg-white border border-slate-300 rounded-full px-3.5 py-1.5 text-xs text-slate-600 active:scale-95 transition">🏦 Cash &amp; bank balance</button>
  </div>
</div>

<!-- Composer -->
<footer class="shrink-0 bg-white border-t border-slate-200 pb-[env(safe-area-inset-bottom)]">
  <div class="max-w-2xl mx-auto flex items-end gap-2 px-3 py-2.5">
    <button id="camBtn" aria-label="Attach a bill photo" class="shrink-0 w-11 h-11 rounded-xl border border-slate-300 bg-slate-50 text-xl active:scale-95 transition grid place-items-center">📷</button>
    <input type="file" id="fileInput" accept="image/*" capture="environment" multiple class="hidden">
    <textarea id="input" rows="1" placeholder="Type, or send a bill photo…"
      class="flex-1 max-h-28 resize-none rounded-xl bg-slate-100 border border-transparent px-4 py-2.5 text-base outline-none focus:border-navy/40 focus:bg-white transition"></textarea>
    <button id="sendBtn" aria-label="Send" class="shrink-0 w-11 h-11 rounded-xl bg-navy text-white text-lg grid place-items-center active:scale-95 transition disabled:opacity-40">
      <span id="sendIcon">➤</span>
      <span id="sendSpin" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
    </button>
  </div>
</footer>

<!-- Full-screen panels -->
<div id="setupPanel" class="hidden fixed inset-0 z-30 bg-slate-100 overflow-y-auto">
  <div class="min-h-full grid place-items-center p-6">
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 w-full max-w-md">
      <div class="w-12 h-12 rounded-2xl bg-navy text-gold font-extrabold grid place-items-center text-2xl mb-4">म</div>
      <h1 class="text-xl font-bold text-navy mb-1">Set up your AI Accountant</h1>
      <p class="text-sm text-slate-500 mb-5 leading-relaxed">One-time setup. You need an Anthropic API key (console.anthropic.com → API keys) and a passcode you'll use to open this app.</p>
      <label class="block text-xs font-semibold text-slate-600 mb-1" for="setupKey">Anthropic API key</label>
      <input id="setupKey" placeholder="sk-ant-…" autocomplete="off"
        class="w-full rounded-xl border border-slate-300 px-4 py-3 text-base outline-none focus:border-navy focus:ring-2 focus:ring-navy/15 transition mb-4">
      <label class="block text-xs font-semibold text-slate-600 mb-1" for="setupPass">Choose a passcode</label>
      <input id="setupPass" type="password" placeholder="At least 4 characters"
        class="w-full rounded-xl border border-slate-300 px-4 py-3 text-base outline-none focus:border-navy focus:ring-2 focus:ring-navy/15 transition">
      <button id="setupBtn" class="btn-primary w-full mt-6 rounded-xl bg-navy text-white font-semibold py-3.5 active:scale-[.98] transition disabled:opacity-50">Start</button>
      <p id="setupErr" class="text-sm text-red-600 mt-3 min-h-5"></p>
    </div>
  </div>
</div>

<div id="loginPanel" class="hidden fixed inset-0 z-30 bg-slate-100 overflow-y-auto">
  <div class="min-h-full grid place-items-center p-6">
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 w-full max-w-md">
      <div class="w-12 h-12 rounded-2xl bg-navy text-gold font-extrabold grid place-items-center text-2xl mb-4">म</div>
      <h1 class="text-xl font-bold text-navy mb-1">Welcome back</h1>
      <p class="text-sm text-slate-500 mb-5">Enter your passcode to open your AI accountant.</p>
      <label class="block text-xs font-semibold text-slate-600 mb-1" for="loginPass">Passcode</label>
      <input id="loginPass" type="password" autocomplete="current-password"
        class="w-full rounded-xl border border-slate-300 px-4 py-3 text-base outline-none focus:border-navy focus:ring-2 focus:ring-navy/15 transition">
      <button id="loginBtn" class="btn-primary w-full mt-6 rounded-xl bg-navy text-white font-semibold py-3.5 active:scale-[.98] transition disabled:opacity-50">Open</button>
      <p id="loginErr" class="text-sm text-red-600 mt-3 min-h-5"></p>
    </div>
  </div>
</div>

<!-- Modal / bottom sheet host -->
<div id="modalHost" class="hidden fixed inset-0 z-40 bg-black/40 flex items-end sm:items-center justify-center" role="dialog" aria-modal="true">
  <div id="modalCard" class="sheet bg-white w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl p-5 pb-[max(env(safe-area-inset-bottom),1.25rem)]"></div>
</div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const chat = $("chat"), scroller = $("chatScroll");
  let pendingImages = [];

  const scroll = () => { scroller.scrollTop = scroller.scrollHeight; };
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // ---------- feedback: toasts ----------
  function toast(msg, type = "info", ms = 3500) {
    const colors = { info: "bg-slate-900/90", success: "bg-emerald-600", error: "bg-red-600" };
    const t = el("div", `toast pointer-events-auto ${colors[type]} text-white text-sm px-4 py-2.5 rounded-xl shadow-lg max-w-sm text-center`, msg);
    $("toasts").appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s"; setTimeout(() => t.remove(), 320); }, ms);
  }

  // ---------- feedback: modal / bottom sheet ----------
  function openModal(build) {
    const host = $("modalHost"), card = $("modalCard");
    card.innerHTML = "";
    host.classList.remove("hidden");
    const close = () => host.classList.add("hidden");
    host.onclick = (e) => { if (e.target === host) close(); };
    build(card, close);
  }

  // ---------- messages ----------
  function addMsg(role, text, attachments) {
    const mine = role === "user";
    const m = el("div", mine
      ? "self-end max-w-[85%] bg-navy text-white rounded-2xl rounded-br-md px-4 py-2.5 text-[15px] leading-relaxed whitespace-pre-wrap break-words shadow-sm"
      : "self-start max-w-[88%] bg-white border border-slate-200 rounded-2xl rounded-bl-md px-4 py-2.5 text-[15px] leading-relaxed whitespace-pre-wrap break-words shadow-sm");
    if (attachments) m.appendChild(el("div", "text-xs italic " + (mine ? "text-white/70" : "text-slate-400"), `📎 ${attachments} photo${attachments > 1 ? "s" : ""} attached`));
    if (text) {
      const safe = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const span = el("span");
      span.innerHTML = safe.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
      m.appendChild(span);
    }
    chat.appendChild(m); scroll();
    return m;
  }
  function addStep(text) { chat.appendChild(el("div", "self-start text-xs text-slate-400 pl-2", "· " + text)); scroll(); }
  function thinking(on) {
    let t = $("thinkRow");
    if (on && !t) {
      t = el("div", "self-start bg-white border border-slate-200 rounded-2xl rounded-bl-md px-4 py-3 flex gap-1.5 shadow-sm"); t.id = "thinkRow";
      for (let i = 0; i < 3; i++) t.appendChild(el("span", "typing-dot w-2 h-2 rounded-full bg-slate-400 inline-block"));
      chat.appendChild(t); scroll();
    } else if (!on && t) t.remove();
  }
  function setBusy(b) {
    $("sendBtn").disabled = b;
    $("sendIcon").classList.toggle("hidden", b);
    $("sendSpin").classList.toggle("hidden", !b);
  }

  async function api(path, body, method) {
    const res = await fetch(path, {
      method: method || (body ? "POST" : "GET"),
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  const STEP_LABELS = {
    tally_status: "Checking Tally…", list_ledgers: "Reading your ledgers…",
    get_daybook: "Reading your entries…", propose_entry: "Preparing the entry for your approval…",
    refresh_knowledge: "Refreshing my knowledge…",
  };
  const fmtDate = (d) => `${d.slice(6, 8)}-${d.slice(4, 6)}-${d.slice(0, 4)}`;
  const fmtAmt = (n) => "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });

  // ---------- draft cards ----------
  function renderDraft(d) {
    const card = el("div", "self-start w-full max-w-[94%] bg-amber-50 border border-amber-300 rounded-2xl p-4 shadow-sm");
    card.appendChild(el("div", "text-[13px] font-semibold text-navy mb-1",
      `📋 Entry for your approval — ${d.voucher.voucher_type}, ${fmtDate(d.voucher.date)}`));
    if (d.voucher.narration) card.appendChild(el("div", "text-xs text-amber-900/70 mb-2", d.voucher.narration));

    const rows = el("div", "divide-y divide-dashed divide-amber-200 mb-2");
    for (const e of d.voucher.entries) {
      const r = el("div", "flex justify-between items-baseline py-1.5 text-sm");
      r.appendChild(el("span", "text-slate-700", `${e.type === "debit" ? "Dr" : "Cr"}  ${e.ledger}`));
      r.appendChild(el("span", "font-semibold tabular-nums text-slate-800", fmtAmt(e.amount)));
      rows.appendChild(r);
    }
    card.appendChild(rows);

    const extras = [];
    if ((d.newLedgers || []).length) extras.push(`Will create ledger${d.newLedgers.length > 1 ? "s" : ""}: ${d.newLedgers.map((l) => `${l.name} (${l.group})`).join(", ")}`);
    if (d.docCount) extras.push(`${d.docCount} bill photo${d.docCount > 1 ? "s" : ""} will be filed with this entry`);
    for (const x of extras) card.appendChild(el("div", "text-xs text-amber-900/70", "• " + x));

    const btns = el("div", "flex gap-2 mt-3");
    const no = el("button", "flex-1 rounded-xl bg-white border border-slate-300 text-slate-600 font-semibold py-2.5 text-sm active:scale-[.98] transition disabled:opacity-50", "Reject");
    const ok = el("button", "flex-1 rounded-xl bg-emerald-600 text-white font-semibold py-2.5 text-sm active:scale-[.98] transition disabled:opacity-50", "✓ Confirm & record");
    btns.append(no, ok);
    card.appendChild(btns);

    const doPost = async () => {
      ok.disabled = no.disabled = true; ok.textContent = "Recording…";
      try {
        const r = await api("/api/confirm", { draft_id: d.id });
        btns.remove();
        card.appendChild(el("div", "mt-1 text-sm font-semibold text-emerald-700",
          r.verified ? "✅ Recorded in Tally and verified in the day book." : "✅ Recorded in Tally (verification pending — check the day book)."));
        if (r.docPaths && r.docPaths.length) card.appendChild(el("div", "text-xs text-amber-900/70 mt-1", "📁 Bill filed: " + r.docPaths[0]));
        toast("Entry recorded" + (r.verified ? " & verified ✓" : ""), "success");
      } catch (err) {
        ok.disabled = no.disabled = false; ok.textContent = "✓ Confirm & record";
        toast(err.message, "error", 5000);
      }
      scroll();
    };

    ok.addEventListener("click", () => {
      if (!d.bigAmount) return doPost();
      openModal((cardEl, close) => {
        cardEl.appendChild(el("h3", "text-base font-bold text-navy mb-1", "Large entry — double check"));
        cardEl.appendChild(el("p", "text-sm text-slate-500 mb-3", `This entry totals ${fmtAmt(d.total)}. Type the amount to confirm.`));
        const inp = document.createElement("input");
        inp.type = "text"; inp.inputMode = "decimal"; inp.placeholder = String(d.total);
        inp.className = "w-full rounded-xl border border-slate-300 px-4 py-3 text-base outline-none focus:border-navy focus:ring-2 focus:ring-navy/15";
        cardEl.appendChild(inp);
        const go = el("button", "w-full mt-4 rounded-xl bg-emerald-600 text-white font-semibold py-3 active:scale-[.98] transition", "Confirm & record");
        cardEl.appendChild(go);
        go.addEventListener("click", () => {
          if (Number(String(inp.value).replace(/[^0-9.]/g, "")) === Number(d.total)) { close(); doPost(); }
          else toast("Amount didn't match — not recorded.", "error");
        });
        setTimeout(() => inp.focus(), 50);
      });
    });
    no.addEventListener("click", async () => {
      ok.disabled = no.disabled = true;
      try {
        await api("/api/reject", { draft_id: d.id });
        btns.remove();
        card.appendChild(el("div", "mt-1 text-sm font-semibold text-slate-500", "Rejected — nothing was recorded."));
        toast("Draft rejected", "info");
      } catch (err) { ok.disabled = no.disabled = false; toast(err.message, "error"); }
    });

    chat.appendChild(card); scroll();
  }

  // ---------- send ----------
  async function send() {
    const text = $("input").value.trim();
    if (!text && pendingImages.length === 0) return;
    $("input").value = "";
    const images = pendingImages; pendingImages = []; renderPreview();
    $("chips").classList.add("hidden");
    addMsg("user", text, images.length || undefined);
    setBusy(true); thinking(true);
    try {
      const data = await api("/api/chat", { text, images });
      thinking(false);
      for (const s of data.steps || []) addStep(STEP_LABELS[s] || s);
      addMsg("assistant", data.reply || "(no reply)");
      for (const d of data.drafts || []) renderDraft(d);
    } catch (err) {
      thinking(false);
      toast(err.message, "error", 5000);
      addMsg("assistant", "⚠️ " + err.message);
    } finally {
      setBusy(false);
      refreshStatus();
    }
  }

  // ---------- attachments ----------
  function renderPreview() {
    const wrap = $("preview"), inner = wrap.firstElementChild;
    inner.innerHTML = "";
    wrap.classList.toggle("hidden", pendingImages.length === 0);
    pendingImages.forEach((img, i) => {
      const holder = el("div", "relative shrink-0");
      const im = document.createElement("img");
      im.src = `data:${img.media_type};base64,${img.data}`;
      im.className = "h-14 rounded-lg border border-slate-300";
      const x = el("button", "absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-slate-800 text-white text-[10px] grid place-items-center", "✕");
      x.setAttribute("aria-label", "Remove photo");
      x.addEventListener("click", () => { pendingImages.splice(i, 1); renderPreview(); });
      holder.append(im, x);
      inner.appendChild(holder);
    });
  }
  function fileToImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.88);
        URL.revokeObjectURL(url);
        resolve({ media_type: "image/jpeg", data: dataUrl.split(",")[1] });
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  // ---------- status / panels ----------
  async function refreshStatus() {
    try {
      const s = await api("/api/status");
      if (!s.configured) return show("setup");
      if (!s.authed) return show("login");
      show("chat");
      $("tallyDot").className = "w-2 h-2 rounded-full " + (s.tallyOnline ? "bg-emerald-400" : "bg-amber-400 animate-pulse");
      $("statusText").textContent = s.tallyOnline ? `Tally connected · ${s.model}` : "Tally offline — open Tally on the computer";
    } catch {
      $("tallyDot").className = "w-2 h-2 rounded-full bg-red-400 animate-pulse";
      $("statusText").textContent = "server unreachable";
    }
  }
  function show(which) {
    $("setupPanel").classList.toggle("hidden", which !== "setup");
    $("loginPanel").classList.toggle("hidden", which !== "login");
    if (which === "chat" && !chat.dataset.loaded) { chat.dataset.loaded = "1"; loadHistory(); }
  }
  async function loadHistory() {
    try {
      const h = await api("/api/history");
      if (h.messages.length === 0) {
        addMsg("assistant", "Namaste! 🙏 I'm Munshi, your AI accountant.\n\nSend me a photo of a bill, or just tell me things like:\n• \"Paid ₹5,000 shop rent in cash yesterday\"\n• \"How much did we sell this month?\"\n\nI'll show you the entry as a card — nothing is recorded until you tap Confirm.");
      } else {
        $("chips").classList.add("hidden");
        for (const m of h.messages) addMsg(m.role, m.text, m.images || undefined);
      }
      const p = await api("/api/drafts");
      for (const d of p.drafts || []) renderDraft(d);
    } catch {}
  }

  // ---------- menu ----------
  function openMenu() {
    openModal((card, close) => {
      card.appendChild(el("h3", "text-base font-bold text-navy mb-3", "Menu"));
      const mk = (label, sub, fn, danger) => {
        const b = el("button", `w-full text-left rounded-xl px-4 py-3 mb-2 border ${danger ? "border-red-200 bg-red-50" : "border-slate-200 bg-slate-50"} active:scale-[.99] transition`);
        b.appendChild(el("div", `text-sm font-semibold ${danger ? "text-red-700" : "text-slate-800"}`, label));
        b.appendChild(el("div", "text-xs text-slate-500", sub));
        b.addEventListener("click", async () => { close(); await fn(); });
        card.appendChild(b);
      };
      mk("🔄 Refresh knowledge", "Re-read companies & ledgers from Tally", async () => {
        try { await api("/api/refresh", {}); toast("Knowledge refreshed from Tally", "success"); refreshStatus(); }
        catch (err) { toast(err.message, "error"); }
      });
      mk("🔒 Lock app", "Ask for the passcode again on this device", async () => {
        try { await api("/api/logout", {}); location.reload(); } catch (err) { toast(err.message, "error"); }
      });
      mk("🗑️ Clear conversation", "Start fresh — recorded entries stay in Tally", async () => {
        openModal((c2, close2) => {
          c2.appendChild(el("h3", "text-base font-bold text-navy mb-1", "Clear the whole conversation?"));
          c2.appendChild(el("p", "text-sm text-slate-500 mb-4", "Entries already recorded in Tally are not affected."));
          const yes = el("button", "w-full rounded-xl bg-red-600 text-white font-semibold py-3 mb-2 active:scale-[.98] transition", "Yes, clear it");
          const noB = el("button", "w-full rounded-xl bg-slate-100 text-slate-600 font-semibold py-3 active:scale-[.98] transition", "Cancel");
          yes.addEventListener("click", async () => { try { await api("/api/reset", {}); location.reload(); } catch (err) { toast(err.message, "error"); close2(); } });
          noB.addEventListener("click", close2);
          c2.append(yes, noB);
        });
      }, true);
    });
  }

  // ---------- events ----------
  $("sendBtn").addEventListener("click", send);
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); send(); }
  });
  $("camBtn").addEventListener("click", () => $("fileInput").click());
  $("fileInput").addEventListener("change", async (e) => {
    for (const f of e.target.files) {
      try { pendingImages.push(await fileToImage(f)); } catch { toast("Couldn't read that photo", "error"); }
    }
    e.target.value = "";
    renderPreview();
    if (pendingImages.length) toast(`${pendingImages.length} photo${pendingImages.length > 1 ? "s" : ""} ready — add a note or just send`, "info");
  });
  document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => { $("input").value = c.dataset.q; send(); }));
  $("menuBtn").addEventListener("click", openMenu);

  const bindPanelBtn = (btnId, run, errId) => {
    const b = $(btnId);
    b.addEventListener("click", async () => {
      $(errId).textContent = ""; b.disabled = true;
      try { await run(); location.reload(); }
      catch (err) { $(errId).textContent = err.message; b.disabled = false; }
    });
  };
  bindPanelBtn("setupBtn", () => api("/api/setup", { apiKey: $("setupKey").value.trim(), passcode: $("setupPass").value }), "setupErr");
  bindPanelBtn("loginBtn", () => api("/api/login", { passcode: $("loginPass").value }), "loginErr");
  $("loginPass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
  $("setupPass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("setupBtn").click(); });

  refreshStatus();
  setInterval(refreshStatus, 60000);
})();
</script>
</body>
</html>
